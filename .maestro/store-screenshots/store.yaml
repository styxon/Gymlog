# The App Store screenshots, one language and one theme per run.
#
# Run by scripts/store-screenshots/shoot.sh, which (re)installs the
# screenshots build (EXPO_PUBLIC_SCREENSHOT_SEED=1, docs/store-screenshots.md)
# and launches it with the language and theme as launch arguments:
#
#   xcrun simctl launch <udid> app.vinha -vinhaLanguage fi -vinhaTheme dark
#
# The first launch of a fresh install writes six weeks of training and
# today's workout under way before the app mounts (src/screenshots/).
# Maestro's own launchApp is not used: on iOS it passed `arguments` through
# without the -e values in them (2026-10-18 run).
#
# shoot.sh copies this folder into the run's output folder, replaces
# @LANGUAGE_CHECK@ with a word only that language shows, and runs Maestro
# from there, so the screenshots land beside it.
#
# No testIDs in the app, so every step finds its control by the text or the
# accessibility label it shows, in either language ("Finnish|English"). A
# Pressable with a label is found by the label, not by its text.
appId: app.vinha
name: Store screenshots
---
# The seed is written before App mounts; then Home with its Continue button.
- extendedWaitUntil:
    visible: "Jatka kesken olevaa treeniä|Resume the workout in progress|Kirjaa sarja 2|Log set 2"
    timeout: 60000

# The wrong language here means the launch argument did not reach the seed.
- assertVisible: "@LANGUAGE_CHECK@"

- runFlow:
    when:
      notVisible: "Kirjaa sarja 2|Log set 2"
    file: open-player.yaml

# 1. The set screen: the last set of the lift under way, last time beside it.
- extendedWaitUntil:
    visible: "Kirjaa sarja 2|Log set 2"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-set-logging

# 2. Logged: the rest, and the next lift under it.
- tapOn: "Kirjaa sarja 2|Log set 2"
- extendedWaitUntil:
    visible: "SEURAAVAKSI|NEXT UP|Ohita lepo|Skip rest"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-next-exercise

# 3. Finish: X, then "I'm done". The summary reads the seeded start, so the
#    duration is the session's, not this script's.
- tapOn: "Poistu ohjatusta tilasta|Leave guided mode"
- tapOn: "Olen valmis|I'm done"
- extendedWaitUntil:
    visible: "Treeni valmis|Workout complete"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 03-workout-complete
- runFlow: leave-summary.yaml

# 4. Progress: the summary with its trend.
- tapOn: "Kehitys|Progress"
- extendedWaitUntil:
    visible: "Yhteenveto|Summary"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-progress

# 5. Records, this month.
- tapOn: "Ennätykset|Records"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-records

# 6. History: its card on the summary, then "See all".
- tapOn: "Yhteenveto|Summary"
- scrollUntilVisible:
    element: "Näytä kaikki|See all"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Näytä kaikki|See all"
    rightOf: "Historia|History"
- extendedWaitUntil:
    visible: "Historia|History"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-history
- tapOn: "Takaisin|Back"

# 7. Home, today done.
- tapOn: "Koti|Home"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-home

# 8. The coach (preview answers: this build has no server).
- tapOn: "Avaa Vinha-valmentaja|Open Vinha Coach"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-coach

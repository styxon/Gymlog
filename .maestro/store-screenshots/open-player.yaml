# Home → the running workout. Home's hero, then the player's own entry
# screen, may each say "Resume workout".
appId: app.vinha
---
- tapOn: "Jatka treeniä|Resume workout"
- runFlow:
    when:
      visible: "Jatka treeniä|Resume workout"
    commands:
      - tapOn: "Jatka treeniä|Resume workout"

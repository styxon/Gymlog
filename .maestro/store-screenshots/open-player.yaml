# Home → the running workout. Home's hero says "Continue"; the player's own
# entry screen may say it again.
appId: app.vinha
---
- tapOn: "Jatka kesken olevaa treeniä|Resume the workout in progress"
- runFlow:
    when:
      visible: "Jatka treeniä|Resume workout"
    commands:
      - tapOn: "Jatka treeniä|Resume workout"

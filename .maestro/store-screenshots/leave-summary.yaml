# From the finished workout's summary back to the tabs. "Valmis/Finish" asks
# how the workout felt first ("Just right" answered, as a reader would); a
# sheet that may follow is closed the same way.
appId: app.vinha
---
- scrollUntilVisible:
    element: "Valmis|Finish"
    direction: DOWN
    timeout: 15000
- tapOn: "Valmis|Finish"
- runFlow:
    when:
      visible: 'Miltä treeni tuntui\?|How did it feel\?'
    commands:
      - tapOn: "Sopiva|Just right"
- runFlow:
    when:
      visible: "Valmis|Finish|Ei nyt|Not now"
    commands:
      - tapOn: "Valmis|Finish|Ei nyt|Not now"
- extendedWaitUntil:
    visible: "Kehitys|Progress"
    timeout: 15000

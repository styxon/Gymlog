# UI check: every list and menu screen, scrolled top to bottom, one language
# and one theme per run. For eyes, not for the store: look for text cut off
# mid-word, overlap, clipped cards, wrong colours in light and dark.
#
# Run by scripts/store-screenshots/shoot.sh with FLOW=ui-check, on the same
# seeded build as the store flow (docs/store-screenshots.md). The simulator's
# text size may be raised (content_size input) to see what large type does.
#
# Controls are found by their visible text or accessibility label as
# "Finnish|English" (src/lib/i18n.ts) where that is reliable, and by testID
# (`id:`) where a text match repeated another screen in the first run: the
# catalog link, a programme card, a library row, the Progress section tabs
# and the Records Seg, a History
# session and the Settings rows. Each part starts
# from a bottom tab, which resets that tab to its root. A control found by id
# is NOT optional: a tap that landed on nothing used to leave a repeat of the
# previous screen under the next screen's name. scrolls.yaml leaves a screen
# scrolled down, so top.yaml swipes back up before each id lookup (an id above
# the viewport is never found by scrolling down). Tab and link taps by text
# stay optional.
# Screens are named NN-<screen>[-k]; -2 and -3 are further down the same
# screen.
appId: app.vinha
name: UI check
---
- extendedWaitUntil:
    visible: "Jatka kesken olevaa treeniä|Resume the workout in progress|Kirjaa sarja 2|Log set 2"
    timeout: 60000
- assertVisible: "@LANGUAGE_CHECK@"
- waitForAnimationToEnd:
    timeout: 6000

# 01 Home. The seeded workout is left open, so Home shows "Resume".
- runFlow:
    file: scrolls.yaml
    env:
      P: "01-home"

# 02 Programs tab.
- tapOn:
    id: "tab-workout"
- runFlow:
    file: scrolls.yaml
    env:
      P: "02-programs"

# 03 All programs (the catalog), 04 a ready programme's page.
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "programs-all-link"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "programs-all-link"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "03-catalog"
# Back to the Programs tab, whose recommendation cards open a programme's page.
- tapOn:
    id: "tab-workout"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "program-card-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "program-card-0"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "program-detail-title"
- runFlow:
    file: scrolls.yaml
    env:
      P: "04-program-detail"

# 05 Exercise library, 06 one exercise.
- tapOn:
    id: "tab-workout"
- scrollUntilVisible:
    element:
      text: "Avaa liikekirjasto|Open the exercise library"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Avaa liikekirjasto|Open the exercise library"
- runFlow:
    file: scrolls.yaml
    env:
      P: "05-exercise-library"
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "exercise-row-0"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "exercise-row-0"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "06-exercise-detail"
# The detail page hides the tab bar: go back to the library first.
- runFlow:
    file: top.yaml
- tapOn:
    id: "exercise-detail-back"
- waitForAnimationToEnd:
    timeout: 2500

# 07 Progress: the summary (trend, month, calendar, history card), then each
#    section tab. 08 Records with each of Weight / Reps / Volume.
- tapOn:
    id: "tab-progress"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-overview"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "07-progress-summary"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-records"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "seg-weight"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-weight"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-reps"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-reps"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-volume"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-volume"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-tracked"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "09-lifts"
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-measures"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "10-measures"

# 11 History from the summary's card, 12 one session.
- runFlow:
    file: top.yaml
- tapOn:
    id: "seg-overview"
- waitForAnimationToEnd:
    timeout: 2500
# By id: the text "Näytä kaikki|See all" also matched Profile's milestones
# footer, and run 39982349828 saved the Profile tab as 11-history.
- scrollUntilVisible:
    element:
      id: "progress-history-all"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "progress-history-all"
- waitForAnimationToEnd:
    timeout: 3000
# History is open before it is shot: a wrong screen stops the run here.
- assertVisible:
    id: "history-back"
- runFlow:
    file: scrolls.yaml
    env:
      P: "11-history"
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "history-session"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "history-session"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "12-session-detail"

# 13 Profile, 14 Milestones.
- tapOn:
    id: "tab-profile"
- runFlow:
    file: scrolls.yaml
    env:
      P: "13-profile"
- scrollUntilVisible:
    element:
      text: "Virstanpylväät.*|Milestones.*"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "Virstanpylväät.*|Milestones.*"
- runFlow:
    file: scrolls.yaml
    env:
      P: "14-milestones"

# 15 Settings: three views, like every screen (a longer walk only repeated the end).
# Another tab first: tapping the Profile tab while Settings is already open
# on it did not bring Profile back, so the gear opened nothing new and the
# assertion below failed on every variant (run 39379511117).
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "profile-settings"
- waitForAnimationToEnd:
    timeout: 3000
# Settings keeps its scroll position between visits, so its profile row can
# be above the viewport (run 39393234051): back to the top before asserting.
- runFlow:
    file: top.yaml
- assertVisible:
    id: "settings-profile"
- runFlow:
    file: scrolls.yaml
    env:
      P: "15-settings"

# 16-20 The sub-screens, each from Profile -> Settings (settings-row.yaml).
# The Training plan page is not here: it opens only from the "set training
# days" prompts, which the seeded reader (training days set) never shows.
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-notifications"
      P: "16-notifications"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-my-data"
      P: "17-my-data"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-export-plan"
      P: "18-export-plan"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-training-break"
      P: "19-training-break"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-subscription"
      P: "20-subscription"

# 21 About you: the profile editor, from Settings' header.
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "profile-settings"
- waitForAnimationToEnd:
    timeout: 3000
# Settings keeps its scroll position between visits, so its profile row can
# be above the viewport (run 39393234051): back to the top before asserting.
- runFlow:
    file: top.yaml
- assertVisible:
    id: "settings-profile"
- runFlow:
    file: top.yaml
- tapOn:
    id: "settings-profile"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "settings-profile"
- runFlow:
    file: scrolls.yaml
    env:
      P: "21-about-you"

# 22 The coach.
- tapOn:
    id: "tab-home"
- tapOn:
    id: "tab-ai"
- runFlow:
    file: scrolls.yaml
    env:
      P: "22-coach"

# 23-30 The pushed screens and sheets the walk above does not reach (added
# 2026-10-23 for the unified list style). Each starts from a bottom tab, and
# the running workout comes last: the player hides the tab bar.
# Not reachable from the seeded reader, so not here:
#  - Training plan: opens only from the "set training days" prompts.
#  - Membership end: the seed's Pro is a lifetime purchase, which has no
#    "End membership" row.
#  - The Workout tab's Programs list ('plans'): its only route is the
#    workout tab's root when programsTabEnabled is false, and the loader
#    forces that flag on.

# 23 Session analysis, from the coach's "See full analysis" link (Pro).
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-ai"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "coach-full-analysis"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "coach-full-analysis"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "coach-full-analysis"
- runFlow:
    file: scrolls.yaml
    env:
      P: "23-session-analysis"

# 24 A legal document (the privacy policy), from Settings.
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-privacy"
      P: "24-legal-document"

# 25 Create program: Programs tab -> "New program" sheet -> build it yourself.
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-workout"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "programs-create"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "programs-create"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "25-new-program-sheet"
- tapOn:
    id: "new-program-build"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "new-program-build"
- runFlow:
    file: scrolls.yaml
    env:
      P: "25-create-program"
# Leaving the builder asks "Discard changes?" (run 39992399965 stopped at 26
# with the dialog still open over the tabs). Answer it, then carry on.
# The name field opens focused, and on iOS its keyboard covers the tab bar
# (runs 40003253456, 40003257684 stopped at 26): close it first.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible: "Hylätäänkö muutokset.*|Discard changes.*"
    commands:
      - tapOn: "Hylkää|Discard"
      - waitForAnimationToEnd:
          timeout: 2500

# 26 A programme day (the first day of the first programme card), 27 its Add
#    exercise sheet, 28 its Swap exercise sheet. Swap is offered only on a day
#    that is not the running workout's, so 28 is conditional.
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-workout"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "program-card-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "program-card-0"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "program-detail-title"
- scrollUntilVisible:
    element:
      id: "program-day-0"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "program-day-0"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "program-detail-title"
- runFlow:
    file: scrolls.yaml
    env:
      P: "26-program-day"
- scrollUntilVisible:
    element:
      id: "day-add-exercise"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "day-add-exercise"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "27-add-exercise-sheet"
- tapOn:
    id: "sheet-close"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: top.yaml
- runFlow:
    when:
      visible:
        id: "day-swap-0"
    commands:
      - tapOn:
          id: "day-swap-0"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "28-swap-exercise-sheet"
      - tapOn:
          id: "sheet-close"
      - waitForAnimationToEnd:
          timeout: 2500

# 29 The running workout's set screen, 30 the lift's exercise sheet. Last:
#    the player hides the tab bar.
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- runFlow:
    file: open-player.yaml
- assertVisible: "Kirjaa sarja 2|Log set 2"
- takeScreenshot: "29-set-screen"
- tapOn:
    id: "set-exercise-card"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "30-exercise-sheet"

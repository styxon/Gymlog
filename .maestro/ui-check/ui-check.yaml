# UI check: every list and menu screen, scrolled top to bottom, one language
# and one theme per run. For eyes, not for the store: look for text cut off
# mid-word, overlap, clipped cards, wrong colours in light and dark.
#
# Run by scripts/store-screenshots/shoot.sh with FLOW=ui-check, on the same
# seeded build as the store flow (docs/store-screenshots.md). The simulator's
# text size may be raised (content_size input) to see what large type does.
#
# Controls are found by their visible text or accessibility label as
# "Finnish|English" (src/lib/i18n.ts) where that is reliable, and by testID
# (`id:`) where a text match repeated another screen in the first run: the
# catalog link, a programme card, a library row, the Records Seg, a History
# session and the Settings rows. Each part starts
# from a bottom tab, which resets that tab to its root, and every step after
# the first screen is optional, so one missing control does not end the walk.
# Screens are named NN-<screen>[-k]; -2 and -3 are further down the same
# screen.
appId: app.vinha
name: UI check
---
- extendedWaitUntil:
    visible: "Jatka kesken olevaa treeniä|Resume the workout in progress|Kirjaa sarja 2|Log set 2"
    timeout: 60000
- assertVisible: "@LANGUAGE_CHECK@"
- waitForAnimationToEnd:
    timeout: 6000

# 01 Home. The seeded workout is left open, so Home shows "Resume".
- runFlow:
    file: scrolls.yaml
    env:
      P: "01-home"

# 02 Programs tab.
- tapOn:
    text: "Ohjelmat|Programs"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "02-programs"

# 03 All programs (the catalog), 04 a ready programme's page.
- scrollUntilVisible:
    element:
      id: "programs-all-link"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: "programs-all-link"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "03-catalog"
# Back to the Programs tab, whose recommendation cards open a programme's page.
- tapOn:
    text: "Ohjelmat|Programs"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "program-card-0"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    id: "program-card-0"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "04-program-detail"

# 05 Exercise library, 06 one exercise.
- tapOn:
    text: "Ohjelmat|Programs"
    optional: true
- scrollUntilVisible:
    element:
      text: "Avaa liikekirjasto|Open the exercise library"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "Avaa liikekirjasto|Open the exercise library"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "05-exercise-library"
- scrollUntilVisible:
    element:
      id: "exercise-row-0"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "exercise-row-0"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "06-exercise-detail"

# 07 Progress: the summary (trend, month, calendar, history card), then each
#    section tab. 08 Records with each of Weight / Reps / Volume.
- tapOn:
    text: "Kehitys|Progress"
    optional: true
- tapOn:
    text: "Yhteenveto|Summary"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "07-progress-summary"
- tapOn:
    text: "Ennätykset|Records"
    optional: true
- tapOn:
    id: "seg-weight"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-weight"
- tapOn:
    id: "seg-reps"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-reps"
- tapOn:
    id: "seg-volume"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    file: scrolls.yaml
    env:
      P: "08-records-volume"
- tapOn:
    text: "Liikkeet|Exercises"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "09-lifts"
- tapOn:
    text: "Mitat|Measures"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "10-measures"

# 11 History from the summary's card, 12 one session.
- tapOn:
    text: "Yhteenveto|Summary"
    optional: true
- scrollUntilVisible:
    element:
      text: "Näytä kaikki|See all"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "Näytä kaikki|See all"
    rightOf: "Historia|History"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "11-history"
- scrollUntilVisible:
    element:
      id: "history-session"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    id: "history-session"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "12-session-detail"

# 13 Profile, 14 Milestones.
- tapOn:
    text: "Profiili|Profile"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "13-profile"
- scrollUntilVisible:
    element:
      text: "Virstanpylväät.*|Milestones.*"
    direction: DOWN
    timeout: 10000
    optional: true
- tapOn:
    text: "Virstanpylväät.*|Milestones.*"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "14-milestones"

# 15 Settings: long, so six views of it.
- tapOn:
    text: "Profiili|Profile"
    optional: true
- tapOn:
    text: "Asetukset|Settings"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "15-settings"
- scroll
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "15-settings-4"
- scroll
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "15-settings-5"
- scroll
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "15-settings-6"

# 16-20 The sub-screens, each from Profile -> Settings (settings-row.yaml).
# The Training plan page is not here: it opens only from the "set training
# days" prompts, which the seeded reader (training days set) never shows.
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-notifications"
      P: "16-notifications"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-my-data"
      P: "17-my-data"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-export-plan"
      P: "18-export-plan"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-training-break"
      P: "19-training-break"
- runFlow:
    file: settings-row.yaml
    env:
      ROW: "settings-subscription"
      P: "20-subscription"

# 21 About you: the profile editor, from Settings' header.
- tapOn:
    text: "Profiili|Profile"
    optional: true
- tapOn:
    text: "Asetukset|Settings"
    optional: true
- tapOn:
    id: "settings-profile"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "21-about-you"

# 22 The coach.
- tapOn:
    text: "Koti|Home"
    optional: true
- tapOn:
    text: "Avaa Vinha-valmentaja|Open Vinha Coach"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "22-coach"

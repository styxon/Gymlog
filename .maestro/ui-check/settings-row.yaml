# One row of Settings: Profile -> Settings, find the row (the list is long
# enough to need a scroll), open it, shoot it top to bottom, go back.
#   ROW   regex for the row's label in either language. A row is one
#         accessible Pressable, so its label may carry the subtitle after the
#         title: the pattern ends in .* / .+ for that.
#   P     the screenshot name.
# Every step is optional: a row that is not there leaves a repeat of Settings
# in the artifact instead of stopping the walk.
appId: app.vinha
---
- tapOn:
    text: "Profiili|Profile"
    optional: true
- tapOn:
    text: "Asetukset|Settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "${ROW}"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    text: "${ROW}"
    optional: true
- runFlow:
    file: scrolls.yaml
    env:
      P: "${P}"
- tapOn:
    text: "Takaisin|Back"
    optional: true

# One row of Settings: Profile tab -> its gear, find the row (the list is long
# enough to need a scroll), open it, shoot it top to bottom. Every hop is by
# testID (tab-profile, profile-settings) and checked: Settings must be open
# before the row is looked for, and gone once the row was tapped.
#   ROW   the row's testID (settings-notifications, settings-my-data, ...).
#         Found by id because the label match repeated Settings in the first
#         run: a row is one accessible Pressable whose label carries its
#         subtitle, so a text pattern was unreliable.
#   P     the screenshot name.
# The id steps are NOT optional: a row that is missing or not tappable stops
# the run, instead of leaving a repeat of Settings in the artifact under the
# sub-screen's name. The previous screen is left scrolled down, so the list
# goes back to the top first (top.yaml); an id above the viewport is never
# found by scrolling down.
appId: app.vinha
---
# Another tab first: tapping the Profile tab while Settings is already open
# on it did not bring Profile back, so the gear opened nothing new and the
# assertion below failed on every variant (run 39379511117).
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "profile-settings"
- waitForAnimationToEnd:
    timeout: 3000
# Settings is open before the row is looked for: its profile row is on it and
# on no sub-screen.
- assertVisible:
    id: "settings-profile"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "${ROW}"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
    centerElement: true
- tapOn:
    id: "${ROW}"
- waitForAnimationToEnd:
    timeout: 3000
# The tap opened a sub-screen: Settings' own marker is gone. A tap that missed
# (a row half under the tab bar) stops the run here instead of shooting
# Settings under the sub-screen's name.
- assertNotVisible:
    id: "settings-profile"
- runFlow:
    file: scrolls.yaml
    env:
      P: "${P}"
# No Back tap: the next part starts from the Profile tab, which resets it.

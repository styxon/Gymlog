# One row of Settings: Profile -> Settings, find the row (the list is long
# enough to need a scroll), open it, shoot it top to bottom, go back.
#   ROW   the row's testID (settings-notifications, settings-my-data, ...).
#         Found by id because the label match repeated Settings in the first
#         run: a row is one accessible Pressable whose label carries its
#         subtitle, so a text pattern was unreliable.
#   P     the screenshot name.
# The id steps are NOT optional: a row that is missing or not tappable stops
# the run, instead of leaving a repeat of Settings in the artifact under the
# sub-screen's name. The previous screen is left scrolled down, so the list
# goes back to the top first (top.yaml); an id above the viewport is never
# found by scrolling down.
appId: app.vinha
---
- tapOn:
    text: "Profiili|Profile"
    optional: true
- tapOn:
    text: "Asetukset|Settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: top.yaml
- scrollUntilVisible:
    element:
      id: "${ROW}"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 60
- tapOn:
    id: "${ROW}"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: scrolls.yaml
    env:
      P: "${P}"
- tapOn:
    text: "Takaisin|Back"
    optional: true

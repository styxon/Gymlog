# Publishes the privacy policy and terms to GitHub Pages — the public URL the
# Play listing requires. Rendered from src/lib/legalDocuments.ts by
# scripts/build-legal-site.cjs, the same single source the app and the
# Markdown exports read, so the published page cannot drift from the in-app
# documents. Interim host: when the real homepage exists, point the Play
# listing there and retire this.
name: Legal pages

on:
  push:
    branches: [main]
    paths:
      - src/lib/legalDocuments.ts
      - scripts/build-legal-site.cjs
      - .github/workflows/legal-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The account deletion page is served from styxon.fi only: it signs in
      # with Google, whose client allows that origin and not this one.
      - run: node scripts/build-legal-site.cjs
        env:
          LEGAL_SITE_WITHOUT_WEB_DELETION: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-legal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
